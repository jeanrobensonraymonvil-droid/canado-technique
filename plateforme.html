<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canado Technique — Plateforme pédagogique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0F1B2D; --navy2:#162236; --navy3:#1E2F47;
  --gold:#C9962A; --gold2:#E8B24A; --gold3:#F5D07A;
  --white:#F4F1EC; --white2:#E8E4DC; --muted:#8A96A8;
  --red:#E24B4A; --green:#27B06E; --blue:#3B82F6; --amber:#F59E0B;
  --radius:12px; --radius-lg:18px; --shadow:0 4px 24px rgba(0,0,0,.35);
  --sidebar-w:280px; --header-h:64px;
  --trans:.22s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--navy);color:var(--white);font-family:'DM Sans',sans-serif;font-size:15px}

/* ─── LAYOUT ─── */
#app{display:flex;flex-direction:column;height:100vh}

/* ─── HEADER ─── */
header{
  height:var(--header-h);display:flex;align-items:center;gap:12px;
  padding:0 20px;background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.07);
  flex-shrink:0;z-index:100;position:relative;
}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.logo-text{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;color:var(--white);line-height:1.1}
.logo-sub{font-size:.65rem;font-weight:400;color:var(--muted);font-family:'DM Sans',sans-serif}
.header-sep{flex:1}
.header-search{
  display:flex;align-items:center;gap:8px;
  background:var(--navy3);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;padding:6px 12px;width:220px;transition:border-color var(--trans);
}
.header-search:focus-within{border-color:var(--gold)}
.header-search input{background:none;border:none;outline:none;color:var(--white);font-size:.85rem;font-family:'DM Sans',sans-serif;width:100%}
.header-search input::placeholder{color:var(--muted)}
.search-icon{color:var(--muted);font-size:.9rem;flex-shrink:0}
#menu-toggle{display:none;background:none;border:none;color:var(--white);font-size:1.3rem;cursor:pointer;padding:4px 8px;border-radius:6px}
#menu-toggle:hover{background:rgba(255,255,255,.07)}

/* ─── MAIN ─── */
main{display:flex;flex:1;overflow:hidden}

/* ─── SIDEBAR ─── */
aside{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--navy2);border-right:1px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform var(--trans);
}
.aside-top{padding:16px 14px 8px;flex-shrink:0}
.aside-label{font-size:.65rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding:0 6px}
.filiere-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.ftab{
  font-size:.72rem;font-weight:600;padding:5px 10px;border-radius:20px;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);
  transition:all var(--trans);white-space:nowrap;
}
.ftab.active,.ftab:hover{color:var(--white);border-color:transparent}
.annee-tabs{display:flex;gap:4px;margin-bottom:8px}
.atab{
  flex:1;font-size:.72rem;font-weight:600;padding:5px 8px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(255,255,255,.08);background:transparent;color:var(--muted);
  transition:all var(--trans);text-align:center;
}
.atab.active{background:rgba(255,255,255,.08);color:var(--white);border-color:transparent}

/* Module list */
.module-list{flex:1;overflow-y:auto;padding:4px 10px 16px}
.module-list::-webkit-scrollbar{width:4px}
.module-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.mod-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-radius:10px;cursor:pointer;transition:background var(--trans);
  border:1px solid transparent;margin-bottom:2px;
}
.mod-item:hover{background:rgba(255,255,255,.05)}
.mod-item.active{background:rgba(201,150,42,.1);border-color:rgba(201,150,42,.25)}
.mod-item.done .mod-bullet{background:var(--green)!important;border-color:var(--green)!important}
.mod-item.done .mod-bullet::after{content:'✓';color:#fff;font-size:.6rem;font-weight:700}
.mod-bullet{
  width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);
  background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:.65rem;font-weight:700;color:var(--muted);transition:all var(--trans);
}
.mod-item.active .mod-bullet{border-color:var(--gold);color:var(--gold)}
.mod-info{flex:1;min-width:0}
.mod-code{font-size:.65rem;font-weight:700;color:var(--gold);letter-spacing:.05em}
.mod-title{font-size:.78rem;color:var(--white2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-meta{font-size:.65rem;color:var(--muted)}
.mod-seuil{
  font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:10px;flex-shrink:0;
}
.seuil-60{background:rgba(39,176,110,.12);color:#27B06E}
.seuil-75{background:rgba(59,130,246,.12);color:#60A5FA}
.seuil-80{background:rgba(245,158,11,.12);color:#F59E0B}
.seuil-85{background:rgba(226,75,74,.12);color:#F87171}

/* Progress bar in sidebar */
.prog-bar-wrap{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.prog-label{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:6px}
.prog-track{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width .5s ease}

/* ─── CONTENT AREA ─── */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--navy)}

/* Welcome screen */
#welcome{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;text-align:center;
}
.welcome-icon{font-size:4rem;margin-bottom:20px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.welcome-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--white);margin-bottom:8px}
.welcome-sub{color:var(--muted);font-size:.9rem;max-width:400px;line-height:1.6;margin-bottom:32px}
.stats-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin-bottom:32px}
.stat-box{background:var(--navy2);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius);padding:16px 24px;text-align:center}
.stat-num{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--gold)}
.stat-lbl{font-size:.75rem;color:var(--muted);margin-top:2px}
.filiere-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.fil-card{
  background:var(--navy2);border:1px solid rgba(255,255,255,.07);
  border-radius:var(--radius-lg);padding:18px 22px;cursor:pointer;
  transition:all var(--trans);min-width:160px;text-align:center;
}
.fil-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.15);box-shadow:var(--shadow)}
.fil-card-icon{font-size:2rem;margin-bottom:8px}
.fil-card-code{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;margin-bottom:2px}
.fil-card-name{font-size:.72rem;color:var(--muted);line-height:1.4}
.fil-card-badge{font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--muted);margin-top:6px;display:inline-block}
.coming-soon{opacity:.5;cursor:default}
.coming-soon:hover{transform:none;box-shadow:none}

/* Module viewer */
#module-viewer{flex:1;display:none;flex-direction:column;overflow:hidden}
.viewer-bar{
  height:48px;display:flex;align-items:center;gap:10px;
  padding:0 16px;background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.07);
  flex-shrink:0;
}
.viewer-back{
  display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);
  cursor:pointer;padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08);
  background:transparent;transition:all var(--trans);
}
.viewer-back:hover{color:var(--white);border-color:rgba(255,255,255,.2)}
.viewer-title{font-size:.85rem;font-weight:600;color:var(--white);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer-actions{display:flex;gap:6px}
.vbtn{
  display:flex;align-items:center;gap:5px;font-size:.75rem;
  padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);
  background:transparent;color:var(--muted);cursor:pointer;transition:all var(--trans);
}
.vbtn:hover{color:var(--white);border-color:rgba(255,255,255,.25)}
.vbtn.done-btn.active{background:rgba(39,176,110,.15);color:#27B06E;border-color:rgba(39,176,110,.3)}
#module-frame{flex:1;border:none;background:var(--navy)}

/* ─── SEARCH RESULTS ─── */
#search-results{
  position:absolute;top:calc(var(--header-h));left:0;right:0;bottom:0;
  background:var(--navy);z-index:50;display:none;overflow-y:auto;padding:20px;
}
.sr-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:var(--white);margin-bottom:16px}
.sr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sr-card{
  background:var(--navy2);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius);
  padding:14px;cursor:pointer;transition:all var(--trans);
}
.sr-card:hover{border-color:rgba(201,150,42,.3);background:rgba(201,150,42,.05)}
.sr-card-code{font-size:.65rem;font-weight:700;color:var(--gold);letter-spacing:.05em;margin-bottom:3px}
.sr-card-title{font-size:.88rem;font-weight:500;color:var(--white);margin-bottom:4px}
.sr-card-meta{font-size:.72rem;color:var(--muted)}
.sr-empty{text-align:center;color:var(--muted);padding:60px;font-size:.9rem}

/* ─── TOAST ─── */
#toast{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--navy3);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:12px 18px;font-size:.82rem;color:var(--white);
  box-shadow:var(--shadow);opacity:0;transform:translateY(10px);
  transition:all .3s ease;pointer-events:none;
}
#toast.show{opacity:1;transform:translateY(0)}

/* ─── OFFLINE BADGE ─── */
#offline-badge{
  display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#E24B4A;color:#fff;padding:8px 16px;border-radius:20px;
  font-size:.78rem;font-weight:600;z-index:999;
}

/* ─── LOGIN OVERLAY ─── */
#login-overlay{
  position:fixed;inset:0;z-index:1000;
  background:var(--navy);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
#login-overlay.hidden{display:none}

.login-card{
  background:var(--navy2);border:1px solid rgba(255,255,255,.09);
  border-radius:20px;padding:40px 36px;width:100%;max-width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
  animation:loginIn .4s cubic-bezier(.4,0,.2,1) both;
}
@keyframes loginIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.login-logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.login-logo-text{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:var(--white);line-height:1.1}
.login-logo-sub{font-size:.68rem;color:var(--muted)}

.login-title{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:var(--white);margin-bottom:4px}
.login-sub{font-size:.82rem;color:var(--muted);margin-bottom:28px;line-height:1.5}

.login-field{margin-bottom:16px}
.login-label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.login-input{
  width:100%;padding:11px 14px;border-radius:10px;
  background:var(--navy3);border:1px solid rgba(255,255,255,.1);
  color:var(--white);font-size:.9rem;font-family:'DM Sans',sans-serif;
  outline:none;transition:border-color var(--trans);
}
.login-input:focus{border-color:var(--gold)}
.login-input::placeholder{color:var(--muted)}

.login-btn{
  width:100%;padding:12px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#0F1B2D;font-size:.9rem;font-weight:700;font-family:'DM Sans',sans-serif;
  border:none;cursor:pointer;margin-top:8px;
  transition:opacity var(--trans),transform var(--trans);
}
.login-btn:hover{opacity:.9;transform:translateY(-1px)}
.login-btn:active{transform:translateY(0)}

.login-error{
  background:rgba(226,75,74,.12);border:1px solid rgba(226,75,74,.3);
  color:#F87171;border-radius:8px;padding:10px 14px;
  font-size:.78rem;margin-bottom:14px;display:none;
}
.login-error.show{display:block}

.login-demo{margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.07)}
.login-demo-title{font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.demo-accounts{display:flex;flex-direction:column;gap:6px}
.demo-acc{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  border-radius:8px;padding:8px 12px;cursor:pointer;
  transition:background var(--trans);font-size:.75rem;
}
.demo-acc:hover{background:rgba(255,255,255,.07)}
.demo-acc-name{font-weight:600;color:var(--white)}
.demo-acc-prog{color:var(--muted)}
.demo-acc-fill{font-size:.65rem;padding:2px 8px;border-radius:10px;font-weight:700}

/* ─── USER BADGE in header ─── */
.user-badge{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  border-radius:8px;padding:5px 12px;cursor:pointer;
  transition:background var(--trans);
}
.user-badge:hover{background:rgba(255,255,255,.1)}
.user-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#0F1B2D;flex-shrink:0}
.user-name{font-size:.78rem;font-weight:600;color:var(--white);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-prog{font-size:.65rem;color:var(--muted)}
.logout-btn{font-size:.7rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;transition:color var(--trans)}
.logout-btn:hover{color:var(--red)}

/* ─── RESPONSIVE MOBILE ─── */
@media(max-width:768px){
  :root{--sidebar-w:100vw}
  aside{
    position:fixed;top:var(--header-h);left:0;bottom:0;z-index:90;
    transform:translateX(-100%);
  }
  aside.open{transform:translateX(0)}
  #menu-toggle{display:block}
  .header-search{width:150px}
  #content{position:fixed;top:var(--header-h);left:0;right:0;bottom:0}
  .stats-row{gap:12px}
  .filiere-cards{gap:10px}
  .fil-card{min-width:140px;padding:14px 16px}
}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <header>
    <button id="menu-toggle" onclick="toggleMenu()" aria-label="Menu">☰</button>
    <div class="logo" onclick="showWelcome()">
      <div class="logo-icon">🎓</div>
      <div>
        <div class="logo-text">Canado Technique</div>
        <div class="logo-sub">Plateforme pédagogique</div>
      </div>
    </div>
    <div class="header-sep"></div>
    <div id="user-badge-wrap"></div>
    <div class="header-search">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="text" placeholder="Rechercher un module..." oninput="handleSearch(this.value)" onkeydown="if(event.key==='Escape'){clearSearch()}">
    </div>
  </header>

  <main>
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="aside-top">
        <div class="aside-label">Filières</div>
        <div class="filiere-tabs" id="filiere-tabs"></div>
        <div class="annee-tabs" id="annee-tabs"></div>
      </div>
      <div class="module-list" id="module-list"></div>
      <div class="prog-bar-wrap">
        <div class="prog-label">
          <span id="prog-text">Progression filière</span>
          <span id="prog-pct">0%</span>
        </div>
        <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      </div>
    </aside>

    <!-- CONTENT -->
    <div id="content">
      <!-- WELCOME -->
      <div id="welcome">
        <div class="welcome-icon">🏫</div>
        <div class="welcome-title">Bienvenue sur la plateforme</div>
        <div class="welcome-sub">Sélectionne une filière dans le panneau de gauche pour commencer ton parcours de formation.</div>
        <div class="stats-row" id="global-stats"></div>
        <div class="filiere-cards" id="filiere-cards"></div>
      </div>

      <!-- MODULE VIEWER -->
      <div id="module-viewer">
        <div class="viewer-bar">
          <button class="viewer-back" onclick="closeModule()">← Retour</button>
          <div class="viewer-title" id="viewer-title">—</div>
          <div class="viewer-actions">
            <button class="vbtn" onclick="printModule()" title="Imprimer">🖨️ Imprimer</button>
            <button class="vbtn done-btn" id="done-btn" onclick="toggleDone()">☐ Marquer terminé</button>
          </div>
        </div>
        <iframe id="module-frame" title="Contenu du module"></iframe>
      </div>

      <!-- SEARCH RESULTS -->
      <div id="search-results">
        <div class="sr-title" id="sr-title"></div>
        <div class="sr-grid" id="sr-grid"></div>
      </div>
    </div>
  </main>
</div>


<div id="toast"></div>
<div id="offline-badge">📡 Mode hors-ligne</div>

<script>
// ─── ÉTAT ───
const LS_KEY  = 'canado_done';
let DATA    = null;
let session = null;
let state   = { filiere:'TRI', annee:1, moduleFile:null, moduleCode:null, locked:false };

// ─── STORAGE ───
function getDone() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch { return {}; }
}
function setDone(code, val) {
  const d = getDone();
  if (val) d[code] = true; else delete d[code];
  localStorage.setItem(LS_KEY, JSON.stringify(d));
}
function isDone(code) { return !!getDone()[code]; }


// ─── BOOT (lit le programme depuis le hash URL) ───
async function boot() {
  // Lire le programme et l'année depuis le hash : #TRI-1, #MEI-2, etc.
  const hash = window.location.hash.replace('#','');
  const parts = hash.split('-');
  if (parts.length >= 2) {
    const prog = parts[0]; // ex: TRI
    const annee = parseInt(parts[1]) || 1;
    if (DATA_PROG_VALID(prog)) {
      state.filiere = prog;
      state.annee = annee;
      state.locked = true; // verrou programme
    }
  }

  try {
    const resp = await fetch('./data.json');
    DATA = await resp.json();
    buildSidebar();
    buildWelcome();
    registerSW();
  } catch(e) {
    document.getElementById('welcome').innerHTML =
      '<div style="color:#E24B4A;text-align:center;padding:40px">Erreur de chargement de data.json.<br><small>Vérifier que le fichier est présent.</small></div>';
  }
}

function DATA_PROG_VALID(p) {
  return ['TRI','TEL','ELM','MEI'].includes(p);
}

function registerSW() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  window.addEventListener('offline', () => document.getElementById('offline-badge').style.display='block');
  window.addEventListener('online',  () => document.getElementById('offline-badge').style.display='none');
}

// ─── BUILD WELCOME ───
function buildWelcome() {
  let totalMods = 0, totalH = 0;
  DATA.filieres.forEach(f => f.annees.forEach(a => {
    totalMods += a.modules.length;
    totalH    += a.heures;
  }));
  const done = Object.keys(getDone()).length;
  document.getElementById('global-stats').innerHTML = `
    <div class="stat-box"><div class="stat-num">${DATA.filieres.length}</div><div class="stat-lbl">Filières</div></div>
    <div class="stat-box"><div class="stat-num">${totalMods}</div><div class="stat-lbl">Modules</div></div>
    <div class="stat-box"><div class="stat-num">${totalH}</div><div class="stat-lbl">Heures de formation</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--green)">${done}</div><div class="stat-lbl">Modules complétés</div></div>
  `;
  // Filière cards — si mode verrouillé, griser les autres filières
  document.getElementById('filiere-cards').innerHTML = DATA.filieres.map(f => {
    const totalF  = f.annees.reduce((s,a)=>s+a.modules.length,0);
    const coming  = totalF === 0;
    const isMyFil = state.locked && f.code === state.filiere;
    const locked  = state.locked && !isMyFil;
    return `<div class="fil-card${coming||locked?' coming-soon':''}"
      style="border-top:3px solid ${f.couleur}20;${isMyFil?'border-color:'+f.couleur+'44;box-shadow:0 0 0 2px '+f.couleur+'22':''}"
      onclick="${coming||locked?'':'selectFiliere(\''+f.code+'\')'}"
      title="${locked?'Tu es inscrit(e) dans le programme '+state.filiere:coming?'Modules en cours de production':''}">
      <div class="fil-card-icon">${f.icone}</div>
      <div class="fil-card-code" style="color:${f.couleur}">${f.code}</div>
      <div class="fil-card-name">${f.nom}</div>
      <div class="fil-card-badge">${locked?'🔒 Autre programme':coming?'Bientôt disponible':isMyFil?'✓ Mon programme · '+totalF+' modules':totalF+' modules'}</div>
    </div>`;
  }).join('');
}

// ─── BUILD SIDEBAR ───
function buildSidebar() {
  // En mode verrouillé (étudiant connecté via index), ne montrer que sa filière
  if (state.locked) {
    const fil = DATA.filieres.find(f => f.code === state.filiere);
    const f = fil || DATA.filieres[0];
    document.getElementById('filiere-tabs').innerHTML =
      `<button class="ftab active" style="background:${f.couleur}22;color:${f.couleur};border-color:${f.couleur}44">${f.icone} ${f.code}</button>`;
  } else {
    document.getElementById('filiere-tabs').innerHTML = DATA.filieres.map(f =>
      `<button class="ftab${f.code===state.filiere?' active':''}"
        style="${f.code===state.filiere?'background:'+f.couleur+'22;color:'+f.couleur+';border-color:'+f.couleur+'44':''}"
        onclick="selectFiliere('${f.code}')">${f.icone} ${f.code}</button>`
    ).join('');
  }

  const fil = DATA.filieres.find(f=>f.code===state.filiere);
  if (!fil) return;

  document.getElementById('annee-tabs').innerHTML = fil.annees.map(a =>
    `<button class="atab${a.annee===state.annee?' active':''}" onclick="selectAnnee(${a.annee})">
      ${a.annee}${a.annee===1?'ère':'ème'} année
    </button>`
  ).join('');

  buildModuleList();
}

function buildModuleList() {
  const fil  = DATA.filieres.find(f=>f.code===state.filiere);
  const annee = fil?.annees.find(a=>a.annee===state.annee);
  const mods  = annee?.modules || [];
  const done  = getDone();

  if (mods.length === 0) {
    document.getElementById('module-list').innerHTML =
      '<div style="padding:20px;text-align:center;color:var(--muted);font-size:.8rem">Modules en cours de production…</div>';
    updateProgress(0, 0);
    return;
  }

  document.getElementById('module-list').innerHTML = mods.map(m => {
    const isActive = m.fichier === state.moduleFile;
    const finished = !!done[m.code];
    const sc = m.seuil<=60?'seuil-60':m.seuil<=75?'seuil-75':m.seuil<=80?'seuil-80':'seuil-85';
    return `<div class="mod-item${isActive?' active':''}${finished?' done':''}" onclick="openModule('${m.fichier}','${m.code}','${m.titre.replace(/'/g,"\\'")}')">
      <div class="mod-bullet">${finished?'':''}</div>
      <div class="mod-info">
        <div class="mod-code">${m.code}</div>
        <div class="mod-title">${m.titre}</div>
        <div class="mod-meta">${m.heures}h</div>
      </div>
      <span class="mod-seuil ${sc}">${m.seuil}%</span>
    </div>`;
  }).join('');

  const completed = mods.filter(m=>done[m.code]).length;
  updateProgress(completed, mods.length);
}

function updateProgress(done, total) {
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-pct').textContent  = pct+'%';
  document.getElementById('prog-text').textContent = `${done}/${total} modules complétés`;
}

// ─── NAVIGATION ───
function selectFiliere(code) {
  if (state.locked && code !== state.filiere) return; // verrou programme
  state.filiere = code;
  state.annee   = 1;
  buildSidebar();
  showWelcome();
  if (window.innerWidth <= 768) closeMenu();
}

function selectAnnee(n) {
  state.annee = n;
  buildSidebar();
}

function openModule(fichier, code, titre) {
  state.moduleFile = fichier;
  state.moduleCode = code;
  document.getElementById('welcome').style.display        = 'none';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('module-viewer').style.display  = 'flex';
  document.getElementById('viewer-title').textContent     = code + ' — ' + titre;
  document.getElementById('module-frame').src             = './' + fichier;
  updateDoneBtn();
  buildModuleList();
  if (window.innerWidth <= 768) closeMenu();
}

function closeModule() {
  state.moduleFile = null;
  state.moduleCode = null;
  document.getElementById('module-viewer').style.display = 'none';
  showWelcome();
  buildModuleList();
}

function showWelcome() {
  document.getElementById('module-viewer').style.display  = 'none';
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('welcome').style.display        = 'flex';
  buildWelcome();
}

// ─── DONE TOGGLE ───
function toggleDone() {
  if (!state.moduleCode) return;
  const was = isDone(state.moduleCode);
  setDone(state.moduleCode, !was);
  updateDoneBtn();
  buildModuleList();
  showToast(!was ? '✅ Module marqué comme terminé' : '↩️ Module marqué non terminé');
}

function updateDoneBtn() {
  const btn  = document.getElementById('done-btn');
  const done = isDone(state.moduleCode);
  btn.textContent = done ? '✅ Terminé' : '☐ Marquer terminé';
  btn.classList.toggle('active', done);
}

// ─── PRINT ───
function printModule() {
  const frame = document.getElementById('module-frame');
  if (frame && frame.contentWindow) frame.contentWindow.print();
}

// ─── SEARCH ───
function handleSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { clearSearch(); return; }
  document.getElementById('welcome').style.display       = 'none';
  document.getElementById('module-viewer').style.display = 'none';
  const sr = document.getElementById('search-results');
  sr.style.display = 'block';

  const results = [];
  // Si mode verrouillé, recherche limitée à sa filière
  const filieres = state.locked
    ? DATA.filieres.filter(f => f.code === state.filiere)
    : DATA.filieres;

  filieres.forEach(f => f.annees.forEach(a => a.modules.forEach(m => {
    if (m.code.toLowerCase().includes(q) || m.titre.toLowerCase().includes(q))
      results.push({...m, filiere:f.code, annee:a.annee, couleur:f.couleur});
  })));

  document.getElementById('sr-title').textContent =
    results.length ? `${results.length} résultat${results.length>1?'s':''} pour "${q}"` : '';

  document.getElementById('sr-grid').innerHTML = results.length
    ? results.map(m => `<div class="sr-card" onclick="openModule('${m.fichier}','${m.code}','${m.titre.replace(/'/g,"\\'")}')">
        <div class="sr-card-code" style="color:${m.couleur}">${m.code} · ${m.filiere} ${m.annee}ème année</div>
        <div class="sr-card-title">${m.titre}</div>
        <div class="sr-card-meta">${m.heures}h · Seuil ${m.seuil}%${isDone(m.code)?' · ✅ Complété':''}</div>
      </div>`).join('')
    : '<div class="sr-empty">Aucun module trouvé pour cette recherche.</div>';
}

function clearSearch() {
  document.getElementById('search-input').value           = '';
  document.getElementById('search-results').style.display = 'none';
  if (state.moduleFile) document.getElementById('module-viewer').style.display = 'flex';
  else showWelcome();
}

// ─── MOBILE MENU ───
function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
function closeMenu()  { document.getElementById('sidebar').classList.remove('open'); }

// ─── TOAST ───
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── KEYBOARD ───
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('search-results').style.display !== 'none') clearSearch();
    else if (state.moduleFile) closeModule();
  }
  if ((e.ctrlKey||e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
});

// ─── INIT ───
boot();
</body>
</html>
